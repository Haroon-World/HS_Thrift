<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | HS_Thrift</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/admin.css?v=2.0">
</head>
<body class="admin-login-page">

  <div class="login-card">
    <div class="brand text-center mb-2"><img src="../assets/logo.png" alt="HS_Thrift" style="height: 52px; width: auto; object-fit: contain;"></div>
    <div class="brand-sub">Admin Panel</div>

    <div id="expiredAlert" class="alert alert-warning d-none mb-3" role="alert">
      <i class="bi bi-clock me-1"></i> Your session has expired. Please log in again.
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="admin@hsthrift.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div style="position:relative;">
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right:2.5rem;">
          <button type="button" id="togglePwd" style="position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#8a7f78;cursor:pointer;padding:0;" aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-group" style="display:flex;align-items:center;gap:.5rem;">
        <input type="checkbox" id="rememberMe" style="width:16px;height:16px;accent-color:var(--admin-accent);">
        <label for="rememberMe" style="font-size:.82rem;color:var(--admin-muted);text-transform:none;letter-spacing:0;margin:0;font-weight:500;">Keep me logged in on this device</label>
      </div>

      <div id="loginError" class="alert alert-danger d-none" role="alert" style="font-size:.85rem;padding:.6rem .85rem;"></div>

      <button type="submit" id="loginBtn" class="btn-admin-primary w-100" style="padding:.75rem;font-size:.95rem;border-radius:10px;margin-top:.5rem;">
        Login to Admin Panel
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:.75rem;color:#8a7f78;">
      <i class="bi bi-lock-fill me-1"></i> Restricted access — authorized administrators only
    </p>
  </div>

  <script src="js/admin.js"></script>
  <script>
    // Show expired session warning
    if (new URLSearchParams(location.search).get('expired') === '1') {
      document.getElementById('expiredAlert').classList.remove('d-none');
    }

    // Redirect if already logged in
    if (getToken()) {
      window.location.href = '/admin/dashboard.html';
    }

    // Password toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('adminPassword');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pwd.type = 'password'; icon.className = 'bi bi-eye'; }
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('d-none');

      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const remember = document.getElementById('rememberMe').checked;

      try {
        let res = null;
        let data = null;

        try {
          res = await fetch('/api/admin-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (res.ok) {
            data = await res.json();
          }
        } catch (fetchErr) {
          console.warn('Admin login API offline — fallback to local preview auth.');
        }

        if (data && data.success) {
          saveAuth(data.token, data.email, remember);
          window.location.href = '/admin/dashboard.html';
          return;
        }

        if (!data && (email === 'admin@hsthrift.com' || email === 'admin') && (password === 'Admin@1234' || password === 'admin')) {
          saveAuth('mock-preview-admin-jwt-token', email, remember);
          window.location.href = '/admin/dashboard.html';
          return;
        }

        if (data && !data.success) {
          errorEl.textContent = data.error || 'Invalid email or password.';
        } else {
          errorEl.textContent = 'Invalid email or password.';
        }
        errorEl.classList.remove('d-none');
      } catch (err) {
        errorEl.textContent = 'Unable to connect to server. Check your connection.';
        errorEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login to Admin Panel';
      }
    });
  </script>
</body>
</html>
